<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shree Radha Jap Counter (Premium)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Yatra+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #fff5e1, #f2e2c4); /* Soft warm sand background */
            height: 100vh;
            display: flex;
            justify-content: center;
            color: #4a3000; /* Dark brown/gold text */
            overflow: hidden;
        }

        /* Mobile Container Simulation */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center, #fffdf8, #f5e4c6);
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Top Header */
        .top-bar {
            background: #5b3e18;
            color: #ffd700;
            padding: 15px;
            text-align: center;
            font-family: 'Yatra One', cursive;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            border-bottom: 3px solid #ffd700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* User Profile & Sync Pill */
        .status-pill {
            margin: 15px auto;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #d4af37;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .status-pill img {
            width: 24px; height: 24px; border-radius: 50%;
        }

        /* Ornate Decorations Area */
        .main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Decorations (Emojis as stand-ins for illustrations) */
        .deco-peacock { position: absolute; font-size: 4rem; opacity: 0.9; z-index: 0; }
        .peacock-left { left: 10px; top: 30%; transform: scaleX(-1); }
        .peacock-right { right: 10px; top: 30%; }
        
        .deco-lotus { position: absolute; font-size: 3rem; z-index: 0; }
        .lotus-1 { left: 30px; bottom: 20%; }
        .lotus-2 { right: 30px; bottom: 20%; }

        /* Counter Box */
        .counter-box {
            text-align: center;
            z-index: 10;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid #d4af37;
            border-radius: 20px;
            padding: 15px 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), inset 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .counter-box h2 { font-size: 1.2rem; font-weight: 600; color: #5b3e18; }
        .counter-box .count { font-size: 4rem; font-weight: 700; color: #a67c00; font-family: 'Poppins', sans-serif; }

        /* The Mala (Beads) Ring */
        .mala-ring {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            /* Simulated rudraksha/tulsi beads using dotted border */
            border: 22px dotted #8b4513; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 0 15px rgba(0,0,0,0.3);
            background: radial-gradient(circle, #fcf3df 0%, #e8d0a9 100%);
            z-index: 10;
        }

        /* Golden Jap Button */
        .gold-btn {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff0a8, #d4af37, #997a00);
            border: 4px solid #f8e473;
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.5);
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            font-size: 2.2rem;
            font-weight: 600;
            font-family: 'Yatra One', cursive;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
        }

        .gold-btn:active {
            transform: scale(0.96);
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.6), 0 5px 10px rgba(0,0,0,0.4);
        }

        /* Central Blue Gem on Button */
        .gem {
            width: 25px; height: 25px;
            background: radial-gradient(circle at 30% 30%, #00f0ff, #006d77);
            border-radius: 50%;
            margin: 5px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5), inset 0 -2px 5px rgba(0,0,0,0.3);
            border: 2px solid #fff;
        }

        /* Reset Button */
        .reset-btn {
            margin-top: 30px;
            background: #006d77;
            color: white;
            border: 2px solid #d4af37;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Bottom Navbar */
        .bottom-nav {
            background: #004d55;
            color: #d4af37;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 3px solid #d4af37;
            font-size: 0.8rem;
        }
        .nav-icons { font-size: 1.5rem; cursor: pointer; }
        .progress-text { text-align: center; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="top-bar">
            🦚 श्री राधा जप काउंटर 🦚
        </div>

        <!-- Sync & Profile Status -->
        <div class="status-pill">
            <span>👤 User Profile |</span>
            <span id="syncStatus">⏳ Connecting...</span>
        </div>

        <!-- Main Display Area -->
        <div class="main-area">
            <!-- Background Ornaments -->
            <div class="deco-peacock peacock-left">🦚</div>
            <div class="deco-peacock peacock-right">🦚</div>
            <div class="deco-lotus lotus-1">🪷</div>
            <div class="deco-lotus lotus-2">🪷</div>

            <!-- Counter -->
            <div class="counter-box">
                <h2>राधा नाम जाप<br>Total Count</h2>
                <div class="count" id="countDisplay">0</div>
            </div>

            <!-- Mala & Button -->
            <div class="mala-ring">
                <button class="gold-btn" id="tapBtn">
                    JAP
                    <div class="gem"></div>
                    राधा
                </button>
            </div>

            <button class="reset-btn" id="resetBtn">🦚 Reset Counter 🦚</button>
        </div>

        <!-- Footer Progress -->
        <div class="bottom-nav">
            <span class="nav-icons">🏠</span>
            <div class="progress-text">
                <strong id="dateDisplay">10 June 2026</strong><br>
                Progress: <span id="progressCount">0</span> / 20000
            </div>
            <span class="nav-icons">⚙️</span>
        </div>

    </div>

    <!-- Firebase v10 SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 FIREBASE CONFIG (Add your details here to enable cloud sync) 🔥
        const firebaseConfig = {
            // apiKey: "YOUR_API_KEY",
            // authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            // projectId: "YOUR_PROJECT_ID"
        };

        let db = null;
        let counterRef = null;
        let isCloudSynced = false;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            counterRef = doc(db, "jap_data", "my_personal_counter");
        } catch (e) {
            console.log("Firebase not configured yet. Using local storage.");
        }

        // DOM Elements
        const countDisplay = document.getElementById('countDisplay');
        const progressCount = document.getElementById('progressCount');
        const tapBtn = document.getElementById('tapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const syncStatus = document.getElementById('syncStatus');
        
        // Date Display
        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('en-GB', dateOptions);

        let currentCount = 0;

        // Initialize from Local Storage first
        if(localStorage.getItem('radhaJapCount')) {
            currentCount = parseInt(localStorage.getItem('radhaJapCount'));
            updateDisplays();
            syncStatus.innerText = "💾 Local Mode";
        }

        function updateDisplays() {
            // Add commas for large numbers (e.g., 12,345)
            countDisplay.innerText = currentCount.toLocaleString('en-IN');
            progressCount.innerText = currentCount;
        }

        // Firebase Sync
        if (counterRef) {
            onSnapshot(counterRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentCount = docSnap.data().count;
                }
                updateDisplays();
                syncStatus.innerText = "☁️ Synced";
                isCloudSynced = true;
            }, (error) => {
                syncStatus.innerText = "⚠️ Offline";
            });
        }

        async function updateCloud(newCount) {
            if(counterRef) {
                try {
                    await setDoc(counterRef, { count: newCount, lastUpdated: new Date() });
                } catch (error) { console.error("Cloud Error", error); }
            }
        }

        // Tap Event
        tapBtn.addEventListener('click', () => {
            currentCount++;
            updateDisplays();
            localStorage.setItem('radhaJapCount', currentCount);
            
            if(isCloudSynced) updateCloud(currentCount);

            if (navigator.vibrate) navigator.vibrate([20, 30, 20]); // Realistic mala bead feel
        });

        // Reset Event
        resetBtn.addEventListener('click', () => {
            if(confirm("क्या आप सच में काउंटर को शून्य (0) करना चाहते हैं?")) {
                currentCount = 0;
                updateDisplays();
                localStorage.setItem('radhaJapCount', 0);
                if(isCloudSynced) updateCloud(0);
            }
        });
    </script>
</body>
</html>
