<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ff9a44">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Shree Radha Jap Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Yatra+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ff9a44, #fc6076, #ffecd2, #fcb69f);
            background-size: 400% 400%;
            animation: divineGlow 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            color: #4a3000;
            overflow: hidden;
            touch-action: manipulation;
        }

        @keyframes divineGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .top-bar {
            background: rgba(91, 62, 24, 0.8);
            backdrop-filter: blur(5px);
            color: #ffd700;
            padding: 15px;
            text-align: center;
            font-family: 'Yatra One', cursive;
            font-size: 1.5rem;
            display: flex; justify-content: center; align-items: center; gap: 15px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.5);
            z-index: 10;
        }

        .status-pill {
            margin: 15px auto;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 8px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); z-index: 10;
        }

        .main-area {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative; z-index: 10;
        }

        .counter-box {
            text-align: center; z-index: 10; margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid rgba(212, 175, 55, 0.6); border-radius: 25px;
            padding: 20px 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        
        .counter-box h2 { font-size: 1.1rem; font-weight: 600; color: #5b3e18; margin-bottom: 5px; }
        
        .count { 
            font-size: 4.5rem; font-weight: 700; color: #d35400; 
            font-family: 'Poppins', sans-serif; line-height: 1; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: transform 0.1s ease-out;
        }
        
        .pop-anim { animation: countPop 0.2s ease-out; }
        @keyframes countPop { 0% { transform: scale(1); } 50% { transform: scale(1.2); color: #e67e22; } 100% { transform: scale(1); } }

        .mala-count { font-size: 1.2rem; font-weight: 600; color: #8e44ad; margin-top: 10px; background: #f3e5f5; padding: 5px 15px; border-radius: 20px; display: inline-block;}

        .mala-ring {
            width: 280px; height: 280px; border-radius: 50%;
            border: 15px dotted rgba(139, 69, 19, 0.6); 
            display: flex; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px);
            z-index: 10; animation: spinMala 60s linear infinite;
        }

        @keyframes spinMala { 100% { transform: rotate(360deg); } }

        .gold-btn {
            width: 180px; height: 180px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff5ba, #f6d365, #fda085);
            border: 4px solid #fff;
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.2), 0 15px 25px rgba(0,0,0,0.2);
            color: #d35400; text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            font-size: 2.5rem; font-weight: 600; font-family: 'Yatra One', cursive;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: absolute; z-index: 20;
            overflow: hidden;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .gold-btn:active {
            transform: scale(0.92);
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.2);
        }

        .floating-radha {
            position: absolute; color: #c0392b; font-size: 1.1rem;
            font-family: 'Yatra One', cursive; font-weight: bold; text-align: center;
            width: 250px; pointer-events: none; z-index: 100; text-shadow: 1px 1px 2px #fff;
            animation: floatTextAnim 1.2s ease-out forwards;
        }

        @keyframes floatTextAnim {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.1); opacity: 0; }
        }

        .ripple {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.8);
            transform: scale(0); animation: rippleAnim 0.5s linear; pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        /* Toasts */
        .toast-msg {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; display: none; width: 90%; text-align: center;
            color: white;
        }
        .error-toast { background: #e74c3c; }
        .success-toast { background: #2ecc71; }

        /* Reminder Modal */
        .reminder-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .reminder-box {
            background: linear-gradient(135deg, #fff9e6, #ffe4b5);
            padding: 30px; border-radius: 20px; text-align: center;
            width: 85%; border: 4px solid #006400; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .reminder-box h3 { font-family: 'Yatra One', cursive; color: #b06ab3; font-size: 1.8rem; margin-bottom: 10px; }
        .reminder-box p { font-size: 1.1rem; color: #5b3e18; margin-bottom: 20px; font-weight: 600; }
        .reminder-btn {
            background: linear-gradient(90deg, #b06ab3, #4568dc); color: #fff; border: none; padding: 10px 30px;
            font-size: 1.1rem; border-radius: 30px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-family: 'Poppins', sans-serif;
        }

        .bottom-nav {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            color: #5b3e18; padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.5); font-size: 0.85rem; z-index: 10;
        }

        .notify-icon {
            font-size: 1.3rem; cursor: pointer; transition: transform 0.2s;
        }
        .notify-icon:active { transform: scale(0.8); }

    </style>
</head>
<body>

    <audio id="maharajJiSound" src="radha_naam.mp3" preload="auto"></audio>

    <div class="app-container" id="appContainer">
        
        <div id="errorToast" class="toast-msg error-toast">⚠️ ऑडियो फाइल (radha_naam.mp3) नहीं मिली!</div>
        <div id="reminderToast" class="toast-msg success-toast">🔔 नोटिफिकेशन चालू हो गए हैं!</div>

        <div id="reminderOverlay" class="reminder-overlay">
            <div class="reminder-box">
                <h3>🦚 श्री राधे 🦚</h3>
                <p>राधा रानी और बिहारी जी आपका स्मरण कर रहे हैं।<br>कृपया कुछ समय निकालकर जाप करें।</p>
                <button class="reminder-btn" onclick="closeReminder()">जय श्री कृष्णा</button>
            </div>
        </div>

        <div class="top-bar">🦚 श्री राधा 🦚</div>
        <div class="status-pill"><span id="syncStatus">✨ आत्मिक शांति</span></div>

        <div class="main-area">
            <div class="counter-box">
                <h2>कुल नाम जाप</h2>
                <div class="count" id="countDisplay">0</div>
                <div class="mala-count">माला: <span id="malaDisplay">0</span></div>
            </div>

            <div style="position: relative; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center;">
                <div class="mala-ring"></div>
                <button class="gold-btn" id="tapBtn">जाप</button>
            </div>
        </div>

        <div class="bottom-nav">
            <!-- नया घंटी बटन नोटिफिकेशन चालू करने के लिए -->
            <span id="notifyBtn" class="notify-icon" title="नोटिफिकेशन चालू करें">🔔</span>
            <strong id="dateDisplay"></strong>
            <span>✨</span>
        </div>
    </div>

    <script>
        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('hi-IN', dateOptions);

        const countDisplay = document.getElementById('countDisplay');
        const malaDisplay = document.getElementById('malaDisplay');
        const tapBtn = document.getElementById('tapBtn');
        const notifyBtn = document.getElementById('notifyBtn');
        const maharajJiAudio = document.getElementById('maharajJiSound');
        const errorToast = document.getElementById('errorToast');
        const reminderToast = document.getElementById('reminderToast');
        const reminderOverlay = document.getElementById('reminderOverlay');

        let currentCount = parseInt(localStorage.getItem('radhaJapCount')) || 0;
        let isAudioCtxInitialized = false;
        let audioCtx;

        function updateDisplays() {
            countDisplay.innerText = currentCount.toLocaleString('en-IN');
            malaDisplay.innerText = Math.floor(currentCount / 108).toLocaleString('en-IN');
        }
        updateDisplays();

        function playDivineChime() {
            if (!audioCtx) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 2); 
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 2.5);
        }

        // --- EXPLICIT NOTIFICATION PERMISSION ---
        notifyBtn.addEventListener('click', () => {
            if (!("Notification" in window)) {
                alert("आपका ब्राउज़र नोटिफिकेशन सपोर्ट नहीं करता है।");
                return;
            }
            
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("हरे कृष्ण! 🙏", {
                        body: "आपके ब्राउज़र नोटिफिकेशन सफलतापूर्वक चालू हो गए हैं!",
                        icon: "https://cdn-icons-png.flaticon.com/512/3389/3389081.png"
                    });
                    reminderToast.innerText = "🔔 नोटिफिकेशन चालू हो गए हैं!";
                    reminderToast.style.display = 'block';
                    setTimeout(() => { reminderToast.style.display = 'none'; }, 3000);
                } else {
                    alert("आपने नोटिफिकेशन की अनुमति नहीं दी है। कृपया ब्राउज़र सेटिंग्स चेक करें।");
                }
            });
        });

        // --- HOURLY REMINDER LOGIC ---
        let reminderSet = false;
        function setupHourlyReminder() {
            if (reminderSet) return;
            reminderSet = true;
            
            // 1 Hour Interval (3600000 ms)
            setInterval(() => {
                reminderOverlay.style.display = 'flex';
                
                if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
                
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("🦚 श्री राधा जाप का समय 🦚", {
                        body: "राधा रानी और बिहारी जी आपका स्मरण कर रहे हैं।",
                        icon: "https://cdn-icons-png.flaticon.com/512/3389/3389081.png"
                    });
                }
            }, 3600000); 
        }

        function closeReminder() {
            reminderOverlay.style.display = 'none';
        }

        tapBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            
            // Initialize Audio Context and Reminder on first tap
            if (!isAudioCtxInitialized) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isAudioCtxInitialized = true;
                setupHourlyReminder(); 
            }
            
            // 1. Counter Update
            currentCount++;
            localStorage.setItem('radhaJapCount', currentCount);
            updateDisplays();
            countDisplay.classList.remove('pop-anim');
            void countDisplay.offsetWidth; 
            countDisplay.classList.add('pop-anim');

            // 2. Play Maharaj Ji Audio
            maharajJiAudio.currentTime = 0; 
            let playPromise = maharajJiAudio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    errorToast.style.display = 'block';
                    setTimeout(() => { errorToast.style.display = 'none'; }, 3000);
                    console.log("Audio Error:", error);
                });
            }

            // 3. 108 Completion Chime, Vibrate & NOTIFICATION
            if(currentCount > 0 && currentCount % 108 === 0) {
                playDivineChime();
                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                
                // माला पूरी होने का नोटिफिकेशन
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("📿 एक माला पूर्ण", {
                        body: `बधाई हो! आपने ${Math.floor(currentCount / 108)} माला पूर्ण कर ली हैं। राधा रानी कृपा करें।`,
                        icon: "https://cdn-icons-png.flaticon.com/512/3389/3389081.png"
                    });
                }
            } else {
                if (navigator.vibrate) navigator.vibrate([15]);
            }

            // 4. Visual Effects (Ripple & Floating Text)
            const circle = document.createElement('span');
            circle.classList.add('ripple');
            const diameter = Math.max(tapBtn.clientWidth, tapBtn.clientHeight);
            const radius = diameter / 2;
            const rect = tapBtn.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || rect.left + radius;
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || rect.top + radius;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${clientX - rect.left - radius}px`;
            circle.style.top = `${clientY - rect.top - radius}px`;
            tapBtn.appendChild(circle);
            setTimeout(() => circle.remove(), 500);

            // Original Text Restored
            const floatingText = document.createElement('div');
            floatingText.classList.add('floating-radha');
            floatingText.innerText = "राधा राधा कृष्ण कृष्ण हरि हरि";
            floatingText.style.left = `${clientX - 125}px`; 
            floatingText.style.top = `${clientY - 40}px`;
            document.body.appendChild(floatingText);
            setTimeout(() => floatingText.remove(), 1200); 
        });

    </script>
</body>
</html>
